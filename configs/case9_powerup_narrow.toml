[system]
type = "matpower"
name = "case9"
K_DV = [130, 21, 13]

[dataset]
n_train = 10000
n_test = 1000
seed_train = 1234
seed_test = 5678
slack_indices = [1, 3, 5]

[output]
dir = "output/case9_powerup_narrow"

# Balanced prior-centred sampler, narrow loading: tight load band near
# capacity and a narrow V-target band (transfers the old narrow S_total /
# V_set_point intent; absolute ranges now derive from auto-calibration).
[sampler]
offset_p = 0.04
offset_q = 0.02
load_min_frac = 0.6
load_max_frac = 0.85
vtarget_min = 1.02
vtarget_max = 1.03
