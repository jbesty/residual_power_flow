[system]
type = "matpower"
name = "case9"
K_DV = [130, 21, 13]

[dataset]
n_train = 10000
n_test = 1000
seed_train = 1234
seed_test = 5678
slack_indices = [1, 3, 5]

[output]
dir = "output/case9_rpf"

# Balanced prior-centred sampler. Load range auto-calibrates to the system's
# carrying capacity; infeasibility is controlled by the offset half-widths.
# All keys optional (defaults shown). slack_indices above is retained as
# dataset metadata but the balanced sampler always solves with plain GN.
[sampler]
offset_p = 0.04
offset_q = 0.02
load_min_frac = 0.4
load_max_frac = 1.0
